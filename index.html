<!DOCTYPE html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>SharkFeed - Hacker Twitter</title>
  <meta property="og:title" content="ของขวัญสำหรับรำ" />
  <meta property="og:description" content="ของขวัญสำหรับรำ embed ทวีต" />
  <meta property="og:image" content="https://socialpoint123.github.io/images/og-image.png" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://socialpoint123.github.io/" />
  <link rel="stylesheet" href="style.css">
</head>
  <main>
    <form id="postForm" enctype="multipart/form-data">
      <textarea id="postContent" placeholder="What's happening? (ข้อความ, ลิงก์ทวีต หรือทั้งสอง)" maxlength="240" required></textarea>
      <input type="file" id="postImage" accept="image/*"/>
      <button type="submit" id="postBtn">Post</button>
    </form>
    <section id="feed"></section>
  </main>
  <template id="postTemplate">
    <article class="post">
      <div class="post-header">
        <img src="images/logo.png" class="avatar" alt="Shark"/>
        <span class="username">SharkUser</span>
        <span class="time"></span>
        <!-- ปุ่มลบจะถูกเติมโดย JS -->
      </div>
      <div class="post-body">
        <p class="content"></p>
        <img class="post-img" style="display:none"/>
      </div>
      <div class="post-actions">
        <button class="like" title="Like">💚</button>
        <button class="comment" title="Comment">💬</button>
        <button class="retweet" title="Retweet">🔁</button>
      </div>
    </article>
  </template>
  <script src="main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>SharkFeed - Hacker Twitter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="hacker-theme">
  <header>
    <img src="images/logo.png" alt="Shark Logo" class="logo"/>
    <h1>SharkFeed</h1>
  </header>
  <main>
    <form id="postForm" enctype="multipart/form-data">
      <textarea id="postContent" placeholder="What's happening?" maxlength="240" required></textarea>
      <input type="file" id="postImage" accept="image/*"/>
      <button type="submit" id="postBtn">Post</button>
    </form>
    <section id="feed"></section>
  </main>
  <template id="postTemplate">
    <article class="post">
      <div class="post-header">
        <img src="images/logo.png" class="avatar" alt="Shark"/>
        <span class="username">SharkUser</span>
        <span class="time"></span>
      </div>
      <div class="post-body">
        <p class="content"></p>
        <img class="post-img" style="display:none"/>
      </div>
      <div class="post-actions">
        <button class="like">💚</button>
        <button class="comment">💬</button>
        <button class="retweet">🔁</button>
      </div>
    </article>
  </template>
  <script src="main.js"></script>
</body>
</html>

name: Run Bot with Firebase  
on:  
  push:  
    branches:  
      - main  
  schedule:  
    - cron: '0 * * * *' # รันทุกชั่วโมง  

jobs:  
  run-bot:  
    runs-on: ubuntu-latest  
    steps:  
      - name: Checkout repository  
        uses: actions/checkout@v3  

      - name: Setup Node.js  
        uses: actions/setup-node@v3  
        with:  
          node-version: '18'  

      - name: Install dependencies  
        run: npm install  

      - name: Authenticate Firebase  
        run: npx firebase-tools login:ci --token ${{ secrets.FIREBASE_PRIVATE_KEY }}  

      - name: Run bot script  
        run: node bot.js  
